<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribuição Geográfica — Colégio Altiora</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#0f1923;--paper:#f5f1eb;--gold:#c9993a;--blue:#1F4E79;--teal:#1a7a6e;--muted:#7a7568;--border:#d4cfc5;--red:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',sans-serif;background:var(--paper);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--ink);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);flex-shrink:0;}
header h1{font-size:1rem;font-weight:800;color:var(--paper);}
.hright{display:flex;align-items:center;gap:14px;}
.htag{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--gold);letter-spacing:3px;text-transform:uppercase;}
.layout{display:grid;grid-template-columns:310px 1fr;flex:1;overflow:hidden;}
.sidebar{background:var(--ink);padding:16px 14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:2px;}.sidebar::-webkit-scrollbar-thumb{background:var(--gold);}
.mono-label{font-family:'DM Mono',monospace;font-size:0.56rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.stat-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);border-radius:6px;padding:9px 11px;}
.stat-card .val{font-size:1.55rem;font-weight:800;color:var(--paper);line-height:1;}
.stat-card.accent .val{color:var(--gold);}
.stat-card .lbl{font-family:'DM Mono',monospace;font-size:0.53rem;color:var(--muted);margin-top:2px;text-transform:uppercase;}
.radius-chart{display:flex;flex-direction:column;gap:4px;}
.radius-row{display:flex;align-items:center;gap:7px;}
.radius-label{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);width:46px;}
.radius-bar-wrap{flex:1;background:rgba(255,255,255,0.07);border-radius:3px;height:16px;overflow:hidden;}
.radius-bar{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;transition:width 0.7s cubic-bezier(.4,0,.2,1);}
.radius-bar span{font-family:'DM Mono',monospace;font-size:0.57rem;color:white;font-weight:500;}
.radius-pct{font-family:'DM Mono',monospace;font-size:0.57rem;color:var(--muted);width:24px;text-align:right;}
.bairro-list{display:flex;flex-direction:column;gap:3px;max-height:155px;overflow-y:auto;}
.bairro-list::-webkit-scrollbar{width:2px;}.bairro-list::-webkit-scrollbar-thumb{background:var(--gold);}
.bairro-row{display:flex;align-items:center;gap:5px;}
.bairro-name{font-size:0.64rem;color:rgba(255,255,255,0.65);width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bairro-bar-wrap{flex:1;background:rgba(255,255,255,0.06);border-radius:2px;height:11px;overflow:hidden;}
.bairro-bar{height:100%;background:var(--teal);border-radius:2px;display:flex;align-items:center;justify-content:flex-end;padding-right:3px;transition:width 0.5s;}
.bairro-bar span{font-family:'DM Mono',monospace;font-size:0.53rem;color:white;}
.filter-row{display:flex;gap:4px;flex-wrap:wrap;}
.chip{font-family:'DM Mono',monospace;font-size:0.57rem;padding:3px 7px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.15s;}
.chip:hover,.chip.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600;}
.main-area{display:flex;flex-direction:column;overflow:hidden;position:relative;}
#map{flex:1;min-height:0;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);flex-shrink:0;height:185px;}
.chart-panel{padding:12px 16px;overflow:hidden;}
.chart-panel+.chart-panel{border-left:1px solid var(--border);}
.chart-title{font-size:0.6rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-family:'DM Mono',monospace;}

/* Leaflet popup */
.leaflet-popup-content-wrapper{border-radius:8px;font-family:'Syne',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.leaflet-popup-content{margin:10px 14px;font-size:0.8rem;}
.popup-sub{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--muted);margin-top:2px;}
.popup-dist{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--blue);margin-top:2px;}
.popup-warn{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--red);margin-top:2px;}
.popup-irmaos{font-family:'DM Mono',monospace;font-size:0.6rem;color:#e67e22;margin-top:4px;padding-top:4px;border-top:1px solid #eee;}
/* Cluster badge */
.cluster-marker{position:relative;display:flex;align-items:center;justify-content:center;}
</style>
</head>

</div>

function haversine(a,b,c,d){
  const R=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;
  return+(R*2*Math.asin(Math.sqrt(x))).toFixed(2);
}
function distColor(d){
  if(d<=2)return'#2ecc71';if(d<=5)return'#3498db';
  if(d<=10)return'#9b59b6';if(d<=20)return'#e67e22';return'#e74c3c';
}

let markers=[], activeTurmas=new Set();
function activeData(){ const d=DADOS.filter(a=>a.lat!=null); return activeTurmas.size>0?d.filter(a=>activeTurmas.has(a.turma)):d; }

// Detectar grupos de irmãos (mesmo endereço)
function buildEndGroups(data){
  const groups={};
  data.forEach(a=>{ const k=a.end_geo; if(!groups[k])groups[k]=[]; groups[k].push(a); });
  return groups;
}

// Dispersar irmãos em pequeno círculo ao redor do ponto central
function dispersePoints(lat,lng,n,idx){
  if(n===1) return {lat,lng};
  const r = 0.00025; // ~25m raio
  const angle = (2*Math.PI/n)*idx - Math.PI/2;
  return { lat: lat + r*Math.cos(angle), lng: lng + r*Math.sin(angle) };
}

function buildMarkers(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const data = activeData();
  document.getElementById('header-count').textContent=`${data.length} alunos`;

  const groups = buildEndGroups(data);

  Object.entries(groups).forEach(([endGeo, grupo])=>{
    const n = grupo.length;
    grupo.forEach((a,idx)=>{
      const pos = dispersePoints(a.lat, a.lng, n, idx);
      const c = distColor(a.dist||99);
      const isGrupo = n > 1;

      // Irmãos: anel externo dourado + tamanho maior
      const size = isGrupo ? 13 : 10;
      const ring = isGrupo ? `box-shadow:0 0 0 3px #c9993a,0 1px 5px rgba(0,0,0,0.35)` : `box-shadow:0 1px 5px rgba(0,0,0,0.35)`;
      const icon = L.divIcon({
        html:`<div style="background:${c};width:${size}px;height:${size}px;border-radius:50%;border:2px solid white;${ring}"></div>`,
        iconSize:[size,size], iconAnchor:[size/2,size/2], className:''
      });

      // Popup com info dos irmãos
      const irmaosHtml = isGrupo
        ? `<div class="popup-irmaos">🏠 Irmãos: ${grupo.map(x=>x.nome.split(' ')[0]).join(', ')}</div>`
        : '';

      const m = L.marker([pos.lat, pos.lng], {icon})
        .bindPopup(`
          <strong>${a.nome}</strong>
          <div class="popup-sub">${a.turma} · ${a.bairro||''}</div>
          <div class="popup-dist">${a.dist!=null?a.dist+' km da escola':'—'}</div>
          ${a.inadimplente?'<div class="popup-warn">⚠ Inadimplente</div>':''}
          ${irmaosHtml}
        `);
      m.addTo(map); markers.push(m);
    });
  });

  updateSidebar(data);
}

// ── SIDEBAR + CHARTS ──────────────────────────────────────────────────────────
function updateSidebar(data){
  document.getElementById('stat-total').textContent=data.length;
  document.getElementById('stat-bairros').textContent=new Set(data.map(a=>a.bairro).filter(Boolean)).size;
  document.getElementById('stat-5km').textContent=data.filter(a=>a.dist<=5).length;
  document.getElementById('stat-20km').textContent=data.filter(a=>a.dist>20).length;

  const rc=document.getElementById('radius-chart'); rc.innerHTML='';
  [[2,'#2ecc71'],[5,'#3498db'],[10,'#9b59b6'],[20,'#e67e22']].forEach(([r,c])=>{
    const cnt=data.filter(a=>a.dist<=r).length;
    const pct=data.length?Math.round(cnt/data.length*100):0;
    rc.innerHTML+=`<div class="radius-row"><div class="radius-label">≤ ${r}km</div>
      <div class="radius-bar-wrap"><div class="radius-bar" style="width:${pct}%;background:${c}"><span>${cnt}</span></div></div>
      <div class="radius-pct">${pct}%</div></div>`;
  });

  const bC={}; data.filter(a=>a.bairro).forEach(a=>{bC[a.bairro]=(bC[a.bairro]||0)+1;});
  const sorted=Object.entries(bC).sort((a,b)=>b[1]-a[1]); const mx=sorted[0]?.[1]||1;
  const bl=document.getElementById('bairro-list'); bl.innerHTML='';
  sorted.forEach(([b,c])=>{ bl.innerHTML+=`<div class="bairro-row">
    <div class="bairro-name" title="${b}">${b}</div>
    <div class="bairro-bar-wrap"><div class="bairro-bar" style="width:${Math.round(c/mx*100)}%"><span>${c}</span></div></div>
  </div>`; });
  buildCharts(data);
}

let cDist=null, cBairro=null;
function buildCharts(data){
  const lims=[2,5,10,20,9999],labs=['≤ 2km','2–5km','5–10km','10–20km','> 20km'],cols=['#2ecc71','#3498db','#9b59b6','#e67e22','#e74c3c'];
  const counts=lims.map((r,i)=>{const p=i===0?0:lims[i-1];return data.filter(a=>a.dist>p&&a.dist<=r).length;});
  const bC={}; data.filter(a=>a.bairro).forEach(a=>{bC[a.bairro]=(bC[a.bairro]||0)+1;});
  const top=Object.entries(bC).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},animation:{duration:400}};
  if(cDist)cDist.destroy();
  cDist=new Chart(document.getElementById('chart-dist'),{type:'bar',data:{labels:labs,datasets:[{data:counts,backgroundColor:cols,borderRadius:4,borderSkipped:false}]},options:{...base,scales:{x:{grid:{display:false},ticks:{font:{family:'DM Mono',size:9},color:'#7a7568'}},y:{grid:{color:'rgba(0,0,0,0.06)'},ticks:{font:{family:'DM Mono',size:9},color:'#7a7568',precision:0}}}}});
  if(cBairro)cBairro.destroy();
  cBairro=new Chart(document.getElementById('chart-bairro'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]),backgroundColor:'#1F4E79',borderRadius:3,borderSkipped:false}]},options:{...base,indexAxis:'y',scales:{x:{grid:{color:'rgba(0,0,0,0.06)'},ticks:{font:{family:'DM Mono',size:9},color:'#7a7568',precision:0}},y:{grid:{display:false},ticks:{font:{family:'DM Mono',size:9},color:'#7a7568'}}}}});
}

function buildFilter(){
  const turmas=[...new Set(DADOS.map(a=>a.turma))].sort();
  const el=document.getElementById('turma-filter'); el.innerHTML='';
  const all=document.createElement('div');
  all.className='chip'+(activeTurmas.size===0?' active':'');
  all.textContent='Todas'; all.onclick=()=>{activeTurmas.clear();buildFilter();buildMarkers();};
  el.appendChild(all);
  turmas.forEach(t=>{
    const c=document.createElement('div');
    c.className='chip'+(activeTurmas.has(t)?' active':'');
    c.textContent=t; c.onclick=()=>{activeTurmas.has(t)?activeTurmas.delete(t):activeTurmas.add(t);buildFilter();buildMarkers();};
    el.appendChild(c);
  });
}

function init(){
  buildFilter();

}
